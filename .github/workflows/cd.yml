name: CD - Deploy OCR Engine to Azure Container Apps

on:
  workflow_run:
    workflows: ["CI - OCR & Machine Learning Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for Azure OpenID Connect (OIDC) federated token exchange
  contents: read
  packages: write # For publishing Docker images to GitHub Container Registry (GHCR)

jobs:
  build-and-publish-image:
    name: Build & Push Production Container Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-azure:
    name: Deploy to Azure Container Apps
    needs: [build-and-publish-image]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy-aca.outputs.app-url }}

    steps:
      - name: Validate Azure Deployment Credentials
        id: auth-check
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "Verifying Azure deployment configuration and credentials..."
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "auth_method=oidc" >> "$GITHUB_OUTPUT"
            echo "Azure OpenID Connect (OIDC) credentials detected."
          elif [ -n "$AZURE_CREDENTIALS" ]; then
            echo "auth_method=sp" >> "$GITHUB_OUTPUT"
            echo "Azure Service Principal credentials detected."
          else
            echo "::error::Missing required Azure deployment credentials in GitHub Secrets!"
            echo "To deploy to Azure Container Apps, configure either:"
            echo "  1) OIDC (Recommended): AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID"
            echo "  2) Service Principal: AZURE_CREDENTIALS"
            echo "Configure these in GitHub repository or environment ('production') secrets."
            exit 1
          fi

      - name: Authenticate to Azure via OpenID Connect (OIDC)
        if: steps.auth-check.outputs.auth_method == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to Azure via Service Principal (Fallback)
        if: steps.auth-check.outputs.auth_method == 'sp'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Container App to Azure
        id: deploy-aca
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME || 'ocr-redaction-engine' }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-ocr-production' }}
          targetPort: 8000

      - name: Verify Live Service Health
        run: |
          APP_URL="${{ steps.deploy-aca.outputs.app-url }}"
          echo "Probing container health at: ${APP_URL}/health"
          curl --fail --retry 5 --retry-delay 10 --retry-connrefused "${APP_URL}/health" || exit 1
          echo "OCR & Text Redaction Engine deployed and healthy on Azure."
